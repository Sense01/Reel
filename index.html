<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REEL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://en.wikipedia.org" crossorigin><link rel="preconnect" href="https://upload.wikimedia.org"><link rel="preconnect" href="https://itunes.apple.com"><link rel="preconnect" href="https://is1-ssl.mzstatic.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0c0b11;--tx:#f3f3f5;--mut:#a0a0aa;--ac:#7b5bf5;--ok:#5de0a8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.c:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* nav */
#nv{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;gap:28px;padding:0 4%;z-index:10;background:linear-gradient(#0c0b11e6,#0000);transition:background .3s}
#nv.s{background:#0c0b11f2}
.logo{font-weight:900;font-size:26px;letter-spacing:.14em;color:#9b83ff;cursor:pointer}
#nv nav{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;flex:1}
#nv nav a{color:#d0d0d6;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500}
#nv nav a:hover{color:#fff}#nv nav a.on{color:#fff;font-weight:700}
.ib{background:#ffffff1f;border-radius:50%;width:36px;height:36px;font-size:18px}
.ib:hover{background:#ffffff40}
/* hero */
:root{--cw:clamp(140px,13.5vw,212px)}
.hero{position:relative;min-height:80vh;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--h1),var(--h2));overflow:hidden;padding:110px 4% 13vh}
.hero>img{position:absolute;pointer-events:none}
.hero>img.wide{inset:0;width:100%;height:100%;object-fit:cover}
.hero>img.bg{inset:-70px;width:calc(100% + 140px);height:calc(100% + 140px);object-fit:cover;filter:blur(38px) saturate(1.5) brightness(.52)}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,var(--bg) 0%,#0c0b1100 42%),linear-gradient(90deg,#0c0b11d9 0%,#0c0b1100 62%)}
.hero.hp:after{background:linear-gradient(0deg,var(--bg) 0%,#0c0b1100 38%),radial-gradient(90% 70% at 20% 70%,#0c0b1166,#0c0b1100)}
.hero .row{position:relative;z-index:2;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:5vw}
.hero .in{max-width:640px}
.hero .pst{flex:0 0 auto;height:min(56vh,540px);aspect-ratio:2/3;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--h1),var(--h2));box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff22}
.hero .pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.hero .pst img.in{opacity:1}
.tag{color:#b39dff;font-weight:800;font-size:12px;letter-spacing:.16em;margin-bottom:10px}
.hero h1{font-size:clamp(34px,5.2vw,68px);line-height:1.02;font-weight:900;margin:0 0 14px;letter-spacing:-.035em;text-shadow:0 2px 28px #000a}
.hero p{color:#d6d6dc;margin:0 0 24px;font-size:15px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:8px;padding:11px 26px;border-radius:10px;font-weight:700;font-size:16px;background:var(--ac);color:#fff;transition:background .2s,transform .2s}
.btn:hover{background:#9279ff}.btn:active{transform:scale(.97)}.btn.s{background:#ffffff1f;color:#fff;backdrop-filter:blur(10px)}.btn.s:hover{background:#ffffff38}
/* rows */
.rw{margin:-7vh 0 0;position:relative;z-index:3}.rw+.rw{margin-top:0}
.rw h3{margin:22px 4% 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sc{position:relative}
.rl{display:flex;gap:16px;overflow-x:auto;padding:26px 4% 34px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 4%}
.rl::-webkit-scrollbar{display:none}
.ar{position:absolute;top:26px;bottom:34px;width:5%;min-width:46px;font-size:38px;color:#fff;opacity:0;transition:opacity .2s;z-index:4;background:linear-gradient(90deg,#0c0b11f2,#0c0b1100)}
.ar.r{background:linear-gradient(270deg,#0c0b11f2,#0c0b1100)}
.sc:hover .ar{opacity:1}.ar.l{left:0}.ar.r{right:0}
/* cards (poster) */
.c{flex:0 0 var(--cw);width:var(--cw);position:relative;cursor:pointer;scroll-snap-align:start;-webkit-tap-highlight-color:transparent;outline:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.c .po{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--h1),var(--h2));box-shadow:0 8px 22px #0007,0 0 0 1px #ffffff17;transition:box-shadow .35s}
.c .po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.c .po img.in{opacity:1}
.c .po:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ffffff1c 0%,#0000 20%),linear-gradient(0deg,#0008 0%,#0000 30%)}
.c .ph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;font-size:clamp(14px,1.4vw,18px);line-height:1.15;letter-spacing:-.01em;color:#e9e6ff;text-shadow:0 2px 12px #0008;background:radial-gradient(120% 80% at 50% 0%,#ffffff22,#0000 62%)}
.c .po.nf .ph{display:flex}
.c.ld .po{background:linear-gradient(110deg,#1b1927 30%,#2b2842 48%,#1b1927 66%);background-size:220% 100%;animation:shim 1.5s linear infinite}
@keyframes shim{to{background-position:-120% 0}}
.c .cp{padding:11px 2px 0}
.c .cp b{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f3f3f5}
.c .cp small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .pl{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#7b5bf5e6;display:flex;align-items:center;justify-content:center;font-size:19px;padding-left:3px;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;z-index:3;pointer-events:none;box-shadow:0 10px 28px #7b5bf566}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff33;z-index:3}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b39dff)}
.bd{position:absolute;top:8px;left:8px;z-index:3;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ok);font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:99px;border:1px solid #5de0a844}
.act{position:absolute;top:8px;right:8px;z-index:4;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .2s}
.act button{width:30px;height:30px;border-radius:50%;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff40;font-size:13px}
.act button:hover{background:var(--ac);border-color:var(--ac)}
.c:focus-visible .po{box-shadow:0 0 0 2px #fff}
@media(hover:hover){
  .c:hover,.c:focus-visible{transform:translateY(-7px)}
  .c:hover .po,.c:focus-visible .po{box-shadow:0 22px 46px #000c,0 0 0 1px #7b5bf5bb,0 0 38px #7b5bf52e}
  .c:hover .po img{transform:scale(1.06)}
  .c:hover .pl,.c:focus-visible .pl{opacity:1;transform:none}
  .c:hover .act,.c:focus-within .act{opacity:1}
}
@media(hover:none){.act{opacity:1}.act button{width:28px;height:28px;font-size:12px}.act .dlb{display:none}.ar{display:none}.c:active{transform:scale(.97)}}
/* pages */
.pg{padding:100px 4% 60px}.pg h1{font-size:40px;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}.sub a{color:#fff;cursor:pointer;text-decoration:underline}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:30px 18px}
.gr .c{flex:none;width:auto}
.back{color:var(--mut);cursor:pointer;display:inline-block;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:8px 4% 12px;flex-wrap:wrap}
.tabs button{background:#ffffff14;padding:7px 18px;border-radius:99px;font-weight:600}.tabs button.on{background:var(--ac);color:#fff}
.ep{display:flex;gap:18px;align-items:center;padding:14px 4%;cursor:pointer;border-bottom:1px solid #ffffff14}
.ep:hover{background:#ffffff0d}
.ep .n{width:28px;font-size:22px;color:var(--mut);text-align:center}
.ep .th{position:relative;flex:0 0 190px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2))}
.ep .th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ep .tx{flex:1;min-width:0}.ep .tx b{display:block;font-size:16px}.ep .tx span{color:var(--mut);font-size:13px}
.ep .ab{display:flex;gap:8px}.ep .ab button{background:#ffffff1f;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}.ep .ab button:hover{background:#ffffff40}
/* forms / modal */
.box{background:#181622;border:1px solid #ffffff1a;border-radius:12px;padding:28px;max-width:620px}
.box ol{padding-left:20px;color:var(--mut)}.box code{background:#ffffff1a;padding:1px 6px;border-radius:4px;color:#fff}
.pri{background:var(--ac);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700}
.gh{background:#ffffff1f;padding:10px 22px;border-radius:6px;font-weight:600}
input,select{font:inherit;background:#0c0b11;color:#fff;border:1px solid #ffffff2e;border-radius:6px;padding:10px 12px;width:100%;margin:6px 0 14px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}
.modal>div{background:#181622;border-radius:12px;padding:26px;width:520px;max-width:100%;max-height:88vh;overflow:auto}
.f{padding:9px 10px;border-radius:6px;cursor:pointer}.f:hover{background:#ffffff14}
/* player */
#pl{position:fixed;inset:0;background:#000;z-index:30;display:none}#pl.on{display:block}
#pl video{width:100%;height:100%;object-fit:contain;background:#000}
#pb{position:absolute;top:0;left:0;right:0;padding:18px 3%;display:flex;gap:16px;align-items:center;background:linear-gradient(#000b,#0000);z-index:2;transition:opacity .3s}
#pb b{flex:1;font-size:18px}
#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px;pointer-events:none}
#tm{position:absolute;top:64px;right:3%;z-index:5;background:#181622f5;border:1px solid #ffffff1f;border-radius:12px;padding:14px;min-width:260px;max-width:92vw;max-height:70vh;overflow:auto;display:none}#tm.on{display:block}
#tm h4{margin:12px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--mut)}#tm h4:first-child{margin-top:0}
#tm button{display:block;width:100%;text-align:left;background:0;padding:8px 10px;border-radius:6px;font-size:14px}#tm button:hover{background:#ffffff1f}#tm button.on{color:var(--ok);font-weight:700}#tm button.x{opacity:.4;cursor:not-allowed}
#vid::cue{background:#000b;color:#fff;font:600 1.15em Inter,system-ui,sans-serif}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-weight:600;padding:10px 20px;border-radius:6px;display:none;z-index:40}
@media(max-width:760px){.ep .th{flex-basis:120px}.ep .ab{display:none}#nv{gap:14px}
  :root{--cw:clamp(128px,38vw,176px)}
  .hero{min-height:0;padding:92px 5% 8vh}
  .hero.hp .row{flex-direction:column-reverse;align-items:center;text-align:center;gap:22px}
  .hero.hp .in{max-width:none}.hero.hp .btns{justify-content:center}
  .hero .pst{height:min(44vh,400px)}
  .hero h1{font-size:clamp(30px,9vw,44px)}
  .rl{gap:12px;padding:22px 5% 28px}.rw h3{margin-left:5%}.gr{gap:24px 14px}}
#nv.s{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#0c0b11;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
#intro .st{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.7,0,.3,1)}
#intro.out{opacity:0;pointer-events:none;transition:opacity .7s ease .1s}
#intro.out .st{transform:scale(1.5)}
#intro .glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,#7b5bf566 0%,#7b5bf51a 40%,#0000 65%);opacity:0;animation:iglow 2.6s ease-out .2s forwards}
@keyframes iglow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.15)}}
#intro .lg{position:relative;display:flex;font-weight:900;font-size:clamp(56px,15vw,150px);letter-spacing:.12em;line-height:1;overflow:hidden;padding:.1em 0 .1em .12em}
#intro .lg span{display:inline-block;background:linear-gradient(180deg,#cfc3ff,#7b5bf5 75%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:irise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.12s)}
@keyframes irise{from{opacity:0;transform:translateY(.35em) scale(.85);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
#intro .lg:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#0000 38%,#ffffffc0 50%,#0000 62%);transform:translateX(-120%);animation:isweep 1.1s ease-in-out 1.5s forwards;mix-blend-mode:overlay}
@keyframes isweep{to{transform:translateX(120%)}}
#intro .ln{height:2px;width:0;margin-top:4px;background:linear-gradient(90deg,#0000,#7b5bf5,#0000);animation:iln 1s ease-out .1s forwards}
@keyframes iln{to{width:min(60vw,420px)}}
#intro .tg{margin-top:20px;padding-left:.42em;color:#a0a0aa;letter-spacing:.42em;font-size:clamp(10px,1.6vw,14px);font-weight:500;opacity:0;animation:ifade .8s ease 1.6s forwards}
@keyframes ifade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
#s51m{position:absolute;top:64px;right:3%;z-index:6;width:min(560px,94vw);max-height:calc(100vh - 84px);overflow:auto;background:#181622f5;border:1px solid #ffffff1f;border-radius:12px;padding:14px;display:none}#s51m.on{display:block}
#s51m header{display:flex;align-items:center;gap:10px;margin-bottom:10px}#s51m header b{flex:1;font-size:16px}
.s51p{position:relative;background:#fff;border-radius:8px;overflow:hidden}.s51p img{display:block;width:100%;height:auto}
.s51l{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;background:radial-gradient(circle,#ff3b57f2 0,#ff3b578c 35%,#ff3b5700 70%);mix-blend-mode:multiply;pointer-events:none}.s51l.sw{width:11%}
.s51m6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--mut);text-align:center}
.s51b{height:56px;background:#ffffff14;border-radius:5px;position:relative;overflow:hidden;margin-bottom:3px}.s51b i{position:absolute;left:0;right:0;bottom:0;height:0;background:#ff3b57}
#s51s{margin-top:10px;padding:8px 10px;border-radius:6px;background:#ffffff0f;font-size:13px;color:var(--mut);border-left:3px solid #ffb347}#s51s.ok{border-left-color:var(--ok);color:var(--tx)}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="glow"></div><div class="st"><div class="lg"><span style="--i:0">R</span><span style="--i:1">E</span><span style="--i:2">E</span><span style="--i:3">L</span></div><div class="ln"></div><div class="tg">O TEU DISCO · O TEU CINEMA</div></div></div>
<script>try{if(sessionStorage.getItem('reelIntro')||matchMedia('(prefers-reduced-motion:reduce)').matches)document.getElementById('intro').remove()}catch(e){}</script>
<header id="nv"></header>
<main id="main"></main>

<div class="modal" id="m1"><div>
  <h3 style="margin:0 0 14px;font-size:22px">Nova biblioteca</h3>
  <label>Nome<input id="ln" placeholder="Filmes, Séries, Anime…"></label>
  <label>Tipo<select id="lt"><option value="movies">Filmes (cada ficheiro é um título)</option><option value="series">Séries (cada subpasta é uma série)</option></select></label>
  <label>Link ou ID da pasta do Drive<input id="fid" placeholder="https://drive.google.com/drive/folders/…"></label>
  <div id="browse"><div style="color:var(--mut);margin-bottom:6px">Ou escolhe a pasta (modo OAuth):</div><div id="crumb" style="margin-bottom:6px"></div>
  <div id="folders" style="border:1px solid #ffffff1f;border-radius:8px;max-height:220px;overflow:auto;margin-bottom:16px"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="gh" onclick="$('#m1').classList.remove('on')">Cancelar</button><button class="pri" id="mk">Usar esta pasta</button></div>
</div></div>

<div id="pl">
  <div id="pb"><button class="ib" onclick="closePlayer()" aria-label="Voltar">←</button><b id="pt"></b><button class="btn s" id="s51btn" style="padding:8px 18px;font-size:15px" onclick="s51Open()">Som 5.1</button><button class="btn s" id="tk" style="display:none;padding:8px 18px;font-size:15px" onclick="trkMenu()">Áudio e legendas</button><button class="btn s" id="nx" style="display:none;padding:8px 18px;font-size:15px" onclick="nextEp()">Próximo ▶</button></div><div id="tm"></div><div id="s51m" role="dialog" aria-label="Colunas 5.1"></div>
  <div id="ld"></div><video id="vid" controls style="display:none"></video>
</div>
<div id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
let S={};try{S=JSON.parse(localStorage.getItem('reel')||'{}')}catch(e){}
S.cid??='';S.key??='';S.tmdb??='';S.art??={};if(S.artv!==7){S.art={};S.artv=7}delete S.emb;S.libs??=[];S.cache??={};S.prog??={};
const save=()=>localStorage.setItem('reel',JSON.stringify(S));
let V={lib:null,show:null,home:true,season:null};
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)};

/* ---- Google + Drive ---- */
let tok=null,exp=0;
function auth(){return new Promise((res,rej)=>{
  if(tok&&Date.now()<exp)return res(tok);
  if(!window.google)return rej(new Error('Script da Google não carregou'));
  google.accounts.oauth2.initTokenClient({client_id:S.cid,scope:'https://www.googleapis.com/auth/drive.readonly',
    callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;exp=Date.now()+(r.expires_in-60)*1000;res(tok)}}).requestAccessToken()})}
const mediaUrl=id=>`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${encodeURIComponent(S.key)}`;
async function api(p){let r;const u='https://www.googleapis.com/drive/v3/'+p;
  if(S.key)r=await fetch(u+(p.includes('?')?'&':'?')+'key='+encodeURIComponent(S.key));
  else{const t=await auth();r=await fetch(u,{headers:{Authorization:'Bearer '+t}})}
  if(!r.ok)throw new Error(r.status===403||r.status===404?'Sem acesso: partilha a pasta como "Qualquer pessoa com o link" e confirma a API key':'Erro Drive '+r.status);return r}
const canSW=()=>'serviceWorker' in navigator&&location.protocol!=='file:';
const swUrl=f=>new URL('stream/'+f.id+'?s='+(f.size||0)+'&n='+encodeURIComponent(f.name),location.href).href;
const direct=f=>S.key?mediaUrl(f.id):swUrl(f);
async function prepSW(){await auth();await(await caches.open('reel-tok')).put('/__tok',new Response(JSON.stringify({tok})));await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,3000)})}
async function ls(id,fo){let out=[],pt='';const q=`'${id}' in parents and trashed=false`+(fo?" and mimeType='application/vnd.google-apps.folder'":'');
  do{const r=await(await api(`files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,size,thumbnailLink)&pageSize=1000&orderBy=name${pt?'&pageToken='+pt:''}`)).json();out.push(...r.files);pt=r.nextPageToken}while(pt);return out}
async function scan(lib){const out=[];
  async function w(id,show){for(const f of await ls(id)){
    if(f.mimeType==='application/vnd.google-apps.folder')await w(f.id,show||f.name);
    else if(f.mimeType.startsWith('video/')||/\.(mkv|mp4|avi|mov|webm|m4v)$/i.test(f.name))out.push({id:f.id,name:f.name,size:+f.size||0,mime:f.mimeType,show:show||'',lib:lib.id,th:f.thumbnailLink||''})}}
  await w(lib.folder,'');S.cache[lib.id]=out;save()}

function s51Ligar(){const v=$('#vid');
  if($('#ifr')){s51Msg('Estás no player do Drive (iframe): o browser não deixa ler o áudio. Usa o player normal do REEL.');return false}
  if(S51.an){s51Ctx();return true}
  const u=v.currentSrc||'';let same=false;try{same=u.startsWith('blob:')||new URL(u,location.href).origin===location.origin}catch(e){}
  if(!same){s51Msg(u?'Este modo de reprodução vem diretamente do Google (outra origem) e o browser não deixa analisar o áudio. Com MKV (remux) ou service worker funciona.':'Abre primeiro um filme e carrega em play.');return false}
  const cap=v.captureStream||v.mozCaptureStream;
  if(!cap){s51Msg('Este browser não deixa ler o áudio sem alterar a saída. Para não estragar o 5.1, a análise fica desligada.');return false}
  try{const ms=cap.call(v),tr=ms.getAudioTracks();
    if(!tr.length){s51Msg('A captura ainda não tem áudio. Carrega em play.');return false}
    const c=s51Ctx(),src=c.createMediaStreamSource(ms),sp=c.createChannelSplitter(6);
    src.connect(sp);/* nada é ligado ao destination: o som continua a sair só pelo player */
    S51.nch=(tr[0].getSettings&&tr[0].getSettings().channelCount)||0;
    S51.an=[0,1,2,3,4,5].map(i=>{const a=c.createAnalyser();a.fftSize=1024;sp.connect(a,i);return{a,b:new Float32Array(1024)}});
    return true}
  catch(e){s51Msg('Não foi possível ligar a análise: '+e.message);return false}}
function s51Open(){$('#tm').classList.remove('on');const m=$('#s51m');
  if(!m.classList.toggle('on')){s51Stop();return}
  s51Build();S51.msg='';
  if(s51Ligar())s51Msg($('#vid').paused?'Carrega em play para ver as colunas.':'A analisar o áudio…');
  s51Stop();S51.last=performance.now();s51Loop()}
function s51Close(){$('#s51m').classList.remove('on');s51Stop()}
function s51Stop(){cancelAnimationFrame(S51.raf);S51.raf=0}
function s51Diag(){const n=S51C.map(c=>c[0]).filter((_,i)=>S51.act[i]),k=S51.nch?' (a captura do browser entrega '+S51.nch+' canais)':'';
  if(S51.act[2]||S51.act[3]||S51.act[4]||S51.act[5])s51Msg('Sinal multicanal detetado: '+n.join(', ')+k+'.',1);
  else s51Msg('Só há sinal em FL e FR'+k+'. Pode ser uma faixa estéreo, ou a captura do browser só entregar 2 canais: não quer dizer que o som que ouves esteja misturado.')}
function s51Loop(){const now=performance.now(),dt=now-S51.last,v=$('#vid');S51.last=now;
  if(!$('#pl').classList.contains('on')){s51Close();return}
  const tn=S51.tn&&now<S51.tn.u?S51.tn.i:-1,play=!v.paused&&!v.ended;
  if(play&&!S51.an&&now-(S51.rt||0)>1000){S51.rt=now;if(s51Ligar())s51Msg('A analisar o áudio…')}
  if(play&&S51.an)S51.pl+=dt;
  for(let i=0;i<6;i++){let t=0;
    if(tn>=0)t=tn===i?1:0;
    else if(S51.an&&play){const{a,b}=S51.an[i];a.getFloatTimeDomainData(b);let s=0;for(let k=0;k<b.length;k++)s+=b[k]*b[k];
      t=Math.max(0,Math.min(1,(20*Math.log10(Math.sqrt(s/b.length)+1e-9)+55)/55));if(t>.08)S51.act[i]=1}
    S51.lv[i]+=(t-S51.lv[i])*(t>S51.lv[i]?.6:.12);const x=S51.lv[i];
    S51.L[i].style.opacity=Math.min(1,x*1.1);S51.L[i].style.transform=`translate(-50%,-50%) scale(${.5+x*.9})`;S51.B[i].style.height=x*100+'%'}
  if(S51.an&&S51.pl>6000)s51Diag();
  S51.raf=requestAnimationFrame(s51Loop)}
async function s51Test(){$('#vid').pause();
  const c=new(window.AudioContext||window.webkitAudioContext)(),d=c.destination,mx=d.maxChannelCount||2;
  try{d.channelCount=Math.min(6,mx);d.channelCountMode='explicit';d.channelInterpretation='speakers'}catch(e){}
  s51Msg('Teste pela Web Audio: este browser aceita '+mx+' canais.'+(mx<6?' Com menos de 6 as colunas ouvem-se misturadas, mas isto só afeta este teste: o filme continua a sair pelo player normal.':''),mx>=6);
  for(const i of[0,2,1,5,4,3]){S51.tn={i,u:performance.now()+1300};
    const b=c.createBuffer(1,c.sampleRate*1.2,c.sampleRate),dt=b.getChannelData(0);for(let k=0;k<dt.length;k++)dt[k]=(Math.random()*2-1)*.3;
    const s=c.createBufferSource();s.buffer=b;let n=s;if(i===3){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=120;s.connect(f);n=f}
    const g=c.createGain(),t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.05);g.gain.setValueAtTime(1,t+1.1);g.gain.linearRampToValueAtTime(0,t+1.2);
    const m=c.createChannelMerger(6);n.connect(g);g.connect(m,0,i);m.connect(d);s.start();
    await new Promise(r=>setTimeout(r,1400))}
  S51.tn=null;c.close()}
$('#vid').addEventListener('loadstart',()=>{S51.act.fill(0);S51.pl=0});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#s51m').classList.contains('on')){e.stopImmediatePropagation();s51Close()}},true);
