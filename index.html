<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REEL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0c0b11;--tx:#f3f3f5;--mut:#a0a0aa;--ac:#7b5bf5;--ok:#5de0a8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.c:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* nav */
#nv{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;gap:28px;padding:0 4%;z-index:10;background:linear-gradient(#0c0b11e6,#0000);transition:background .3s}
#nv.s{background:#0c0b11f2}
.logo{font-weight:900;font-size:26px;letter-spacing:.14em;color:#9b83ff;cursor:pointer}
#nv nav{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;flex:1}
#nv nav a{color:#d0d0d6;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500}
#nv nav a:hover{color:#fff}#nv nav a.on{color:#fff;font-weight:700}
.ib{background:#ffffff1f;border-radius:50%;width:36px;height:36px;font-size:18px}
.ib:hover{background:#ffffff40}
/* hero */
.hero{position:relative;height:82vh;min-height:480px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--h1),var(--h2));overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0c0b11ee 0%,#0c0b1166 45%,#0000 70%),linear-gradient(0deg,var(--bg) 0%,#0000 35%)}
.hero .in{position:relative;z-index:2;padding:0 4% 11vh;max-width:680px}
.tag{color:var(--ac);font-weight:800;font-size:13px;margin-bottom:8px}
.hero h1{font-size:clamp(34px,5.5vw,72px);line-height:1;font-weight:900;margin:0 0 14px;letter-spacing:-.03em;text-shadow:0 2px 24px #0008}
.hero p{color:#d6d6dc;margin:0 0 22px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:8px;padding:10px 26px;border-radius:8px;font-weight:700;font-size:17px;background:var(--ac);color:#fff}
.btn:hover{background:#9279ff}.btn.s{background:#ffffff1f;color:#fff}.btn.s:hover{background:#ffffff38}
/* rows */
.rw{margin:-6vh 0 0;position:relative;z-index:3}.rw+.rw{margin-top:0}
.rw h3{margin:18px 4% 0;font-size:20px;font-weight:700}
.sc{position:relative}
.rl{display:flex;gap:8px;overflow-x:auto;padding:28px 4%;scrollbar-width:none;scroll-snap-type:x proximity}
.rl::-webkit-scrollbar{display:none}
.ar{position:absolute;top:28px;bottom:28px;width:4%;background:#000a;font-size:28px;opacity:0;transition:opacity .2s;z-index:4}
.sc:hover .ar{opacity:1}.ar.l{left:0}.ar.r{right:0}
/* cards */
.c{flex:0 0 clamp(230px,19vw,310px);aspect-ratio:16/9;border-radius:6px;position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--h1),var(--h2));scroll-snap-align:start;transition:transform .25s,box-shadow .25s}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000e 0%,#0000 55%)}
.c:hover,.c:focus-visible{transform:scale(1.12);z-index:5;box-shadow:0 0 0 2px var(--ac),0 14px 40px #000c}
.ct{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;font-weight:700;line-height:1.2}
.ct small{display:block;font-weight:400;color:#cfcfd6;font-size:12px;margin-top:2px}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff40;z-index:3}.pb i{display:block;height:100%;background:var(--ac)}
.bd{position:absolute;top:8px;left:8px;z-index:3;background:#000a;color:var(--ok);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.act{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.c:hover .act,.c:focus-within .act{opacity:1}
.act button{width:30px;height:30px;border-radius:50%;background:#000b;border:1px solid #fff8;font-size:14px}
.act button:hover{background:var(--ac);border-color:var(--ac)}
/* pages */
.pg{padding:100px 4% 60px}.pg h1{font-size:40px;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}.sub a{color:#fff;cursor:pointer;text-decoration:underline}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 10px}
.gr .c{flex:none}
.back{color:var(--mut);cursor:pointer;display:inline-block;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:8px 4% 12px;flex-wrap:wrap}
.tabs button{background:#ffffff14;padding:7px 18px;border-radius:99px;font-weight:600}.tabs button.on{background:var(--ac);color:#fff}
.ep{display:flex;gap:18px;align-items:center;padding:14px 4%;cursor:pointer;border-bottom:1px solid #ffffff14}
.ep:hover{background:#ffffff0d}
.ep .n{width:28px;font-size:22px;color:var(--mut);text-align:center}
.ep .th{position:relative;flex:0 0 190px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2))}
.ep .th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ep .tx{flex:1;min-width:0}.ep .tx b{display:block;font-size:16px}.ep .tx span{color:var(--mut);font-size:13px}
.ep .ab{display:flex;gap:8px}.ep .ab button{background:#ffffff1f;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}.ep .ab button:hover{background:#ffffff40}
/* forms / modal */
.box{background:#181622;border:1px solid #ffffff1a;border-radius:12px;padding:28px;max-width:620px}
.box ol{padding-left:20px;color:var(--mut)}.box code{background:#ffffff1a;padding:1px 6px;border-radius:4px;color:#fff}
.pri{background:var(--ac);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700}
.gh{background:#ffffff1f;padding:10px 22px;border-radius:6px;font-weight:600}
input,select{font:inherit;background:#0c0b11;color:#fff;border:1px solid #ffffff2e;border-radius:6px;padding:10px 12px;width:100%;margin:6px 0 14px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}
.modal>div{background:#181622;border-radius:12px;padding:26px;width:520px;max-width:100%;max-height:88vh;overflow:auto}
.f{padding:9px 10px;border-radius:6px;cursor:pointer}.f:hover{background:#ffffff14}
/* player */
#pl{position:fixed;inset:0;background:#000;z-index:30;display:none}#pl.on{display:block}
#pl video{width:100%;height:100%;object-fit:contain;background:#000}
#pb{position:absolute;top:0;left:0;right:0;padding:18px 3%;display:flex;gap:16px;align-items:center;background:linear-gradient(#000b,#0000);z-index:2;transition:opacity .3s}
#pb b{flex:1;font-size:18px}
#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px;pointer-events:none}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-weight:600;padding:10px 20px;border-radius:6px;display:none;z-index:40}
@media(max-width:760px){.ep .th{flex-basis:120px}.ep .ab{display:none}.hero{height:70vh}#nv{gap:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#0c0b11;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
#intro .st{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.7,0,.3,1)}
#intro.out{opacity:0;pointer-events:none;transition:opacity .7s ease .1s}
#intro.out .st{transform:scale(1.5)}
#intro .glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,#7b5bf566 0%,#7b5bf51a 40%,#0000 65%);opacity:0;animation:iglow 2.6s ease-out .2s forwards}
@keyframes iglow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.15)}}
#intro .lg{position:relative;display:flex;font-weight:900;font-size:clamp(56px,15vw,150px);letter-spacing:.12em;line-height:1;overflow:hidden;padding:.1em 0 .1em .12em}
#intro .lg span{display:inline-block;background:linear-gradient(180deg,#cfc3ff,#7b5bf5 75%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:irise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.12s)}
@keyframes irise{from{opacity:0;transform:translateY(.35em) scale(.85);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
#intro .lg:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#0000 38%,#ffffffc0 50%,#0000 62%);transform:translateX(-120%);animation:isweep 1.1s ease-in-out 1.5s forwards;mix-blend-mode:overlay}
@keyframes isweep{to{transform:translateX(120%)}}
#intro .ln{height:2px;width:0;margin-top:4px;background:linear-gradient(90deg,#0000,#7b5bf5,#0000);animation:iln 1s ease-out .1s forwards}
@keyframes iln{to{width:min(60vw,420px)}}
#intro .tg{margin-top:20px;padding-left:.42em;color:#a0a0aa;letter-spacing:.42em;font-size:clamp(10px,1.6vw,14px);font-weight:500;opacity:0;animation:ifade .8s ease 1.6s forwards}
@keyframes ifade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="glow"></div><div class="st"><div class="lg"><span style="--i:0">R</span><span style="--i:1">E</span><span style="--i:2">E</span><span style="--i:3">L</span></div><div class="ln"></div><div class="tg">O TEU DISCO · O TEU CINEMA</div></div></div>
<script>try{if(sessionStorage.getItem('reelIntro')||matchMedia('(prefers-reduced-motion:reduce)').matches)document.getElementById('intro').remove()}catch(e){}</script>
<header id="nv"></header>
<main id="main"></main>

<div class="modal" id="m1"><div>
  <h3 style="margin:0 0 14px;font-size:22px">Nova biblioteca</h3>
  <label>Nome<input id="ln" placeholder="Filmes, Séries, Anime…"></label>
  <label>Tipo<select id="lt"><option value="movies">Filmes (cada ficheiro é um título)</option><option value="series">Séries (cada subpasta é uma série)</option></select></label>
  <label>Link ou ID da pasta do Drive<input id="fid" placeholder="https://drive.google.com/drive/folders/…"></label>
  <div id="browse"><div style="color:var(--mut);margin-bottom:6px">Ou escolhe a pasta (modo OAuth):</div><div id="crumb" style="margin-bottom:6px"></div>
  <div id="folders" style="border:1px solid #ffffff1f;border-radius:8px;max-height:220px;overflow:auto;margin-bottom:16px"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="gh" onclick="$('#m1').classList.remove('on')">Cancelar</button><button class="pri" id="mk">Usar esta pasta</button></div>
</div></div>

<div id="pl">
  <div id="pb"><button class="ib" onclick="closePlayer()" aria-label="Voltar">←</button><b id="pt"></b><button class="btn s" id="nx" style="display:none;padding:8px 18px;font-size:15px" onclick="nextEp()">Próximo ▶</button></div>
  <div id="ld"></div><video id="vid" controls style="display:none"></video>
</div>
<div id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
let S={};try{S=JSON.parse(localStorage.getItem('reel')||'{}')}catch(e){}
S.cid??='';S.key??='';S.tmdb??='';S.art??={};if(S.artv!==4){if(S.artv===3){for(const k in S.art)if(S.art[k].n)delete S.art[k]}else S.art={};S.artv=4}delete S.emb;S.libs??=[];S.cache??={};S.prog??={};
const save=()=>localStorage.setItem('reel',JSON.stringify(S));
let V={lib:null,show:null,home:true,season:null};
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500)};

/* ---- Google + Drive ---- */
let tok=null,exp=0;
function auth(){return new Promise((res,rej)=>{
  if(tok&&Date.now()<exp)return res(tok);
  if(!window.google)return rej(new Error('Script da Google não carregou'));
  google.accounts.oauth2.initTokenClient({client_id:S.cid,scope:'https://www.googleapis.com/auth/drive.readonly',
    callback:r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;exp=Date.now()+(r.expires_in-60)*1000;res(tok)}}).requestAccessToken()})}
const mediaUrl=id=>`https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${encodeURIComponent(S.key)}`;
async function api(p){let r;const u='https://www.googleapis.com/drive/v3/'+p;
  if(S.key)r=await fetch(u+(p.includes('?')?'&':'?')+'key='+encodeURIComponent(S.key));
  else{const t=await auth();r=await fetch(u,{headers:{Authorization:'Bearer '+t}})}
  if(!r.ok)throw new Error(r.status===403||r.status===404?'Sem acesso: partilha a pasta como "Qualquer pessoa com o link" e confirma a API key':'Erro Drive '+r.status);return r}
const canSW=()=>'serviceWorker' in navigator&&location.protocol!=='file:';
const swUrl=f=>new URL('stream/'+f.id+'?s='+(f.size||0)+'&n='+encodeURIComponent(f.name),location.href).href;
const direct=f=>S.key?mediaUrl(f.id):swUrl(f);
async function prepSW(){await auth();await(await caches.open('reel-tok')).put('/__tok',new Response(JSON.stringify({tok})));await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,3000)})}
async function ls(id,fo){let out=[],pt='';const q=`'${id}' in parents and trashed=false`+(fo?" and mimeType='application/vnd.google-apps.folder'":'');
  do{const r=await(await api(`files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,size,thumbnailLink)&pageSize=1000&orderBy=name${pt?'&pageToken='+pt:''}`)).json();out.push(...r.files);pt=r.nextPageToken}while(pt);return out}
async function scan(lib){const out=[];
  async function w(id,show){for(const f of await ls(id)){
    if(f.mimeType==='application/vnd.google-apps.folder')await w(f.id,show||f.name);
    else if(f.mimeType.startsWith('video/')||/\.(mkv|mp4|avi|mov|webm|m4v)$/i.test(f.name))out.push({id:f.id,name:f.name,size:+f.size||0,mime:f.mimeType,show:show||'',lib:lib.id,th:f.thumbnailLink||''})}}
  await w(lib.folder,'');S.cache[lib.id]=out;save()}

/* ---- helpers ---- */
const title=n=>n.replace(/\.[^.]+$/,'').replace(/[._]+/g,' ').trim();
const se=n=>{const m=n.match(/s(\d{1,2})\s*e(\d{1,3})/i)||n.match(/(\d{1,2})x(\d{2,3})/i);return m?[+m[1],+m[2]]:[0,0]};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const hv=s=>`--h1:hsl(${245+hue(s)%40} 28% 24%);--h2:hsl(250 18% 9%)`;
const thOld=(f,w=640)=>f&&f.th?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(f.th.replace(/=s\d+$/,'=s'+w))}" onerror="this.remove()">`:'';
const P=id=>S.prog[id]||{t:0,d:0,w:false};
const pct=id=>{const p=P(id);return p.w?100:p.d?Math.min(100,p.t/p.d*100):0};
const mmss=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const status=id=>{const p=P(id);return p.w?'Visto':p.t>5?`Parou em ${mmss(p.t)}`:'Por ver'};
const allFiles=()=>Object.values(S.cache).flat();
const byId=id=>allFiles().find(f=>f.id===id);
const sortEps=a=>a.sort((x,y)=>{const p=se(x.name),q=se(y.name);return p[0]-q[0]||p[1]-q[1]||x.name.localeCompare(y.name)});
const showsOf=lib=>{const o={};(S.cache[lib.id]||[]).forEach(f=>(o[f.show||'Outros']??=[]).push(f));Object.values(o).forEach(sortEps);return o};
const nextUp=eps=>eps.find(e=>!P(e.id).w&&P(e.id).t>5)||eps.find(e=>!P(e.id).w)||eps[0];

/* ---- capas (TMDB) ---- */
const clean=n=>{const s=n.replace(/\.[^.]+$/,'').replace(/[._]+/g,' ').replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  let i=s.slice(3).search(/(^|[\s-])((19|20)\d{2}|\d{3,4}p|Full ?HD|FHD|UHD|4K|HDR|MULTi|VF[FI2]?|VOSTFR|TRUEFRENCH|FRENCH|DUAL|DUBLADO|LEGENDADO|PT-?(PT|BR)|WEB-?Rip|WEB-?DL|WEB|Blu-?Ray|BDRip|HDRip|DVDRip|HDTV|REMUX|EXTENDED|REPACK|PROPER|[x×]26[45]|H ?26[45]|HEVC|S\d{1,2}E\d{1,3})(?=[\s-]|$)/i);i=i<0?s.length:i+3;
  return{t:s.slice(0,i).replace(/[\s\-–—:]+$/,'').trim(),y:(s.slice(i).match(/^\W*((19|20)\d{2})(?=\W|$)/)||[])[1]||''}};
const artKey=f=>{const l=S.libs.find(x=>x.id===f.lib),sr=l&&l.type==='series'&&f.show,c=clean(sr?f.show+'.x':f.name);return(sr?'t':'m')+'|'+c.t+'|'+(sr?'':c.y)};
const th=(f,w=640,raw)=>{const a=!raw&&f&&S.art[artKey(f)];if(!a||a.n)return thOld(f,w);
  if(a.u)return`<img src="${esc(a.u)}" style="filter:blur(22px) brightness(.55);transform:scale(1.3)" onerror="this.remove()"><img src="${esc(a.u)}" style="object-fit:contain" onerror="this.remove()">`;
  const u=a.b||a.p;return u?`<img loading="lazy" src="https://image.tmdb.org/t/p/${w>900?'w1280':'w780'}${u}" onerror="this.remove()">`:thOld(f,w)};
const jp=u=>new Promise((res,rej)=>{const n='_cb'+Math.random().toString(36).slice(2),sc=document.createElement('script');
  const t=setTimeout(()=>{delete window[n];sc.remove();rej(new Error('iTunes não respondeu'))},12000);
  window[n]=d=>{clearTimeout(t);delete window[n];sc.remove();res(d)};sc.onerror=()=>{clearTimeout(t);delete window[n];sc.remove();rej(new Error('iTunes indisponível'))};
  sc.src=u+'&callback='+n;document.head.appendChild(sc)});
async function itu(k){const[t,q,y]=k.split('|'),nz=x=>x.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  if(nz(q).length<2){S.art[k]={n:1};return}
  const r=await jp('https://itunes.apple.com/search?limit=15&media='+(t==='m'?'movie&entity=movie':'tvShow&entity=tvSeason')+'&term='+encodeURIComponent(q)),nm=x=>nz(x.trackName||x.collectionName||'');
  const m=(r.results||[]).filter(x=>x.artworkUrl100&&nm(x).includes(nz(q)));
  const sc=x=>((y&&(x.releaseDate||'').startsWith(y))?0:1000)+nm(x).length;m.sort((a,b)=>sc(a)-sc(b));
  S.art[k]=m[0]?{u:m[0].artworkUrl100.replace(/\/\d+x\d+bb/,'/600x600bb')}:{n:1}}
/* capas automáticas sem chave: TVMaze (séries) + Wikipedia (filmes/séries) + iTunes (último recurso) */
const nz=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
async function jf(u,ms=10000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function tvm(q){const r=await jf('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)),n=nz(q);
  const m=r.filter(x=>x.show&&x.show.image&&(nz(x.show.name)===n||nz(x.show.name).includes(n)));
  m.sort((a,b)=>(nz(a.show.name)===n?0:1)-(nz(b.show.name)===n?0:1)||b.score-a.score);
  return m[0]?(m[0].show.image.original||m[0].show.image.medium).replace(/^http:/,'https:'):''}
async function wk(q,y,t){const n=nz(q);let err=0;
  for(const lg of['pt','en']){
    const hint=lg==='pt'?(t==='m'?'filme':'série'):(t==='m'?'film':'TV series'),term=q+(t==='m'&&y?' '+y:'')+' '+hint;
    try{const d=await jf('https://'+lg+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=6&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=600&gsrsearch='+encodeURIComponent(term));
      const pg=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index);
