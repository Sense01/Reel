<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REEL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://en.wikipedia.org" crossorigin><link rel="preconnect" href="https://upload.wikimedia.org"><link rel="preconnect" href="https://itunes.apple.com"><link rel="preconnect" href="https://is1-ssl.mzstatic.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#0c0b11;--tx:#f3f3f5;--mut:#a0a0aa;--ac:#7b5bf5;--ok:#5de0a8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,.c:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* nav */
#nv{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;gap:28px;padding:0 4%;z-index:10;background:linear-gradient(#0c0b11e6,#0000);transition:background .3s}
#nv.s{background:#0c0b11f2}
.logo{font-weight:900;font-size:26px;letter-spacing:.14em;color:#9b83ff;cursor:pointer}
#nv nav{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;flex:1}
#nv nav a{color:#d0d0d6;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500}
#nv nav a:hover{color:#fff}#nv nav a.on{color:#fff;font-weight:700}
.ib{background:#ffffff1f;border-radius:50%;width:36px;height:36px;font-size:18px}
.ib:hover{background:#ffffff40}
/* hero */
:root{--cw:clamp(140px,13.5vw,212px)}
.hero{position:relative;min-height:80vh;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--h1),var(--h2));overflow:hidden;padding:110px 4% 13vh}
.hero>img{position:absolute;pointer-events:none}
.hero>img.wide{inset:0;width:100%;height:100%;object-fit:cover}
.hero>img.bg{inset:-70px;width:calc(100% + 140px);height:calc(100% + 140px);object-fit:cover;filter:blur(38px) saturate(1.5) brightness(.52)}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,var(--bg) 0%,#0c0b1100 42%),linear-gradient(90deg,#0c0b11d9 0%,#0c0b1100 62%)}
.hero.hp:after{background:linear-gradient(0deg,var(--bg) 0%,#0c0b1100 38%),radial-gradient(90% 70% at 20% 70%,#0c0b1166,#0c0b1100)}
.hero .row{position:relative;z-index:2;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:5vw}
.hero .in{max-width:640px}
.hero .pst{flex:0 0 auto;height:min(56vh,540px);aspect-ratio:2/3;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(160deg,var(--h1),var(--h2));box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff22}
.hero .pst img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.hero .pst img.in{opacity:1}
.tag{color:#b39dff;font-weight:800;font-size:12px;letter-spacing:.16em;margin-bottom:10px}
.hero h1{font-size:clamp(34px,5.2vw,68px);line-height:1.02;font-weight:900;margin:0 0 14px;letter-spacing:-.035em;text-shadow:0 2px 28px #000a}
.hero p{color:#d6d6dc;margin:0 0 24px;font-size:15px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:8px;padding:11px 26px;border-radius:10px;font-weight:700;font-size:16px;background:var(--ac);color:#fff;transition:background .2s,transform .2s}
.btn:hover{background:#9279ff}.btn:active{transform:scale(.97)}.btn.s{background:#ffffff1f;color:#fff;backdrop-filter:blur(10px)}.btn.s:hover{background:#ffffff38}
/* rows */
.rw{margin:-7vh 0 0;position:relative;z-index:3}.rw+.rw{margin-top:0}
.rw h3{margin:22px 4% 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sc{position:relative}
.rl{display:flex;gap:16px;overflow-x:auto;padding:26px 4% 34px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 4%}
.rl::-webkit-scrollbar{display:none}
.ar{position:absolute;top:26px;bottom:34px;width:5%;min-width:46px;font-size:38px;color:#fff;opacity:0;transition:opacity .2s;z-index:4;background:linear-gradient(90deg,#0c0b11f2,#0c0b1100)}
.ar.r{background:linear-gradient(270deg,#0c0b11f2,#0c0b1100)}
.sc:hover .ar{opacity:1}.ar.l{left:0}.ar.r{right:0}
/* cards (poster) */
.c{flex:0 0 var(--cw);width:var(--cw);position:relative;cursor:pointer;scroll-snap-align:start;-webkit-tap-highlight-color:transparent;outline:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.c .po{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--h1),var(--h2));box-shadow:0 8px 22px #0007,0 0 0 1px #ffffff17;transition:box-shadow .35s}
.c .po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.c .po img.in{opacity:1}
.c .po:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ffffff1c 0%,#0000 20%),linear-gradient(0deg,#0008 0%,#0000 30%)}
.c .ph{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:14px;text-align:center;font-weight:800;font-size:clamp(14px,1.4vw,18px);line-height:1.15;letter-spacing:-.01em;color:#e9e6ff;text-shadow:0 2px 12px #0008;background:radial-gradient(120% 80% at 50% 0%,#ffffff22,#0000 62%)}
.c .po.nf .ph{display:flex}
.c.ld .po{background:linear-gradient(110deg,#1b1927 30%,#2b2842 48%,#1b1927 66%);background-size:220% 100%;animation:shim 1.5s linear infinite}
@keyframes shim{to{background-position:-120% 0}}
.c .cp{padding:11px 2px 0}
.c .cp b{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f3f3f5}
.c .cp small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .pl{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#7b5bf5e6;display:flex;align-items:center;justify-content:center;font-size:19px;padding-left:3px;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;z-index:3;pointer-events:none;box-shadow:0 10px 28px #7b5bf566}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#ffffff33;z-index:3}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#b39dff)}
.bd{position:absolute;top:8px;left:8px;z-index:3;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ok);font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:99px;border:1px solid #5de0a844}
.act{position:absolute;top:8px;right:8px;z-index:4;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .2s}
.act button{width:30px;height:30px;border-radius:50%;background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff40;font-size:13px}
.act button:hover{background:var(--ac);border-color:var(--ac)}
.c:focus-visible .po{box-shadow:0 0 0 2px #fff}
@media(hover:hover){
  .c:hover,.c:focus-visible{transform:translateY(-7px)}
  .c:hover .po,.c:focus-visible .po{box-shadow:0 22px 46px #000c,0 0 0 1px #7b5bf5bb,0 0 38px #7b5bf52e}
  .c:hover .po img{transform:scale(1.06)}
  .c:hover .pl,.c:focus-visible .pl{opacity:1;transform:none}
  .c:hover .act,.c:focus-within .act{opacity:1}
}
@media(hover:none){.act{opacity:1}.act button{width:28px;height:28px;font-size:12px}.act .dlb{display:none}.ar{display:none}.c:active{transform:scale(.97)}}
/* pages */
.pg{padding:100px 4% 60px}.pg h1{font-size:40px;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}.sub a{color:#fff;cursor:pointer;text-decoration:underline}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:30px 18px}
.gr .c{flex:none;width:auto}
.back{color:var(--mut);cursor:pointer;display:inline-block;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:8px 4% 12px;flex-wrap:wrap}
.tabs button{background:#ffffff14;padding:7px 18px;border-radius:99px;font-weight:600}.tabs button.on{background:var(--ac);color:#fff}
.ep{display:flex;gap:18px;align-items:center;padding:14px 4%;cursor:pointer;border-bottom:1px solid #ffffff14}
.ep:hover{background:#ffffff0d}
.ep .n{width:28px;font-size:22px;color:var(--mut);text-align:center}
.ep .th{position:relative;flex:0 0 190px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--h1),var(--h2))}
.ep .th img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ep .tx{flex:1;min-width:0}.ep .tx b{display:block;font-size:16px}.ep .tx span{color:var(--mut);font-size:13px}
.ep .ab{display:flex;gap:8px}.ep .ab button{background:#ffffff1f;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}.ep .ab button:hover{background:#ffffff40}
/* forms / modal */
.box{background:#181622;border:1px solid #ffffff1a;border-radius:12px;padding:28px;max-width:620px}
.box ol{padding-left:20px;color:var(--mut)}.box code{background:#ffffff1a;padding:1px 6px;border-radius:4px;color:#fff}
.pri{background:var(--ac);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700}
.gh{background:#ffffff1f;padding:10px 22px;border-radius:6px;font-weight:600}
input,select{font:inherit;background:#0c0b11;color:#fff;border:1px solid #ffffff2e;border-radius:6px;padding:10px 12px;width:100%;margin:6px 0 14px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}
.modal>div{background:#181622;border-radius:12px;padding:26px;width:520px;max-width:100%;max-height:88vh;overflow:auto}
.f{padding:9px 10px;border-radius:6px;cursor:pointer}.f:hover{background:#ffffff14}
/* player */
#pl{position:fixed;inset:0;background:#000;z-index:30;display:none}#pl.on{display:block}
#pl video{width:100%;height:100%;object-fit:contain;background:#000}
#pb{position:absolute;top:0;left:0;right:0;padding:18px 3%;display:flex;gap:16px;align-items:center;background:linear-gradient(#000b,#0000);z-index:2;transition:opacity .3s}
#pb b{flex:1;font-size:18px}
#ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:30px;pointer-events:none}
#tm{position:absolute;top:64px;right:3%;z-index:5;background:#181622f5;border:1px solid #ffffff1f;border-radius:12px;padding:14px;min-width:260px;max-width:92vw;max-height:70vh;overflow:auto;display:none}#tm.on{display:block}
#tm h4{margin:12px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--mut)}#tm h4:first-child{margin-top:0}
#tm button{display:block;width:100%;text-align:left;background:0;padding:8px 10px;border-radius:6px;font-size:14px}#tm button:hover{background:#ffffff1f}#tm button.on{color:var(--ok);font-weight:700}#tm button.x{opacity:.4;cursor:not-allowed}
#vid::cue{background:#000b;color:#fff;font:600 1.15em Inter,system-ui,sans-serif}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-weight:600;padding:10px 20px;border-radius:6px;display:none;z-index:40}
@media(max-width:760px){.ep .th{flex-basis:120px}.ep .ab{display:none}#nv{gap:14px}
  :root{--cw:clamp(128px,38vw,176px)}
  .hero{min-height:0;padding:92px 5% 8vh}
  .hero.hp .row{flex-direction:column-reverse;align-items:center;text-align:center;gap:22px}
  .hero.hp .in{max-width:none}.hero.hp .btns{justify-content:center}
  .hero .pst{height:min(44vh,400px)}
  .hero h1{font-size:clamp(30px,9vw,44px)}
  .rl{gap:12px;padding:22px 5% 28px}.rw h3{margin-left:5%}.gr{gap:24px 14px}}
#nv.s{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#0c0b11;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
#intro .st{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.7,0,.3,1)}
#intro.out{opacity:0;pointer-events:none;transition:opacity .7s ease .1s}
#intro.out .st{transform:scale(1.5)}
#intro .glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,#7b5bf566 0%,#7b5bf51a 40%,#0000 65%);opacity:0;animation:iglow 2.6s ease-out .2s forwards}
@keyframes iglow{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:.7;transform:scale(1.15)}}
#intro .lg{position:relative;display:flex;font-weight:900;font-size:clamp(56px,15vw,150px);letter-spacing:.12em;line-height:1;overflow:hidden;padding:.1em 0 .1em .12em}
#intro .lg span{display:inline-block;background:linear-gradient(180deg,#cfc3ff,#7b5bf5 75%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:irise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.12s)}
@keyframes irise{from{opacity:0;transform:translateY(.35em) scale(.85);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
#intro .lg:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#0000 38%,#ffffffc0 50%,#0000 62%);transform:translateX(-120%);animation:isweep 1.1s ease-in-out 1.5s forwards;mix-blend-mode:overlay}
@keyframes isweep{to{transform:translateX(120%)}}
#intro .ln{height:2px;width:0;margin-top:4px;background:linear-gradient(90deg,#0000,#7b5bf5,#0000);animation:iln 1s ease-out .1s forwards}
@keyframes iln{to{width:min(60vw,420px)}}
#intro .tg{margin-top:20px;padding-left:.42em;color:#a0a0aa;letter-spacing:.42em;font-size:clamp(10px,1.6vw,14px);font-weight:500;opacity:0;animation:ifade .8s ease 1.6s forwards}
@keyframes ifade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
#s51m{position:absolute;top:64px;right:3%;z-index:6;width:min(560px,94vw);max-height:calc(100vh - 84px);overflow:auto;background:#181622f5;border:1px solid #ffffff1f;border-radius:12px;padding:14px;display:none}#s51m.on{display:block}
#s51m header{display:flex;align-items:center;gap:10px;margin-bottom:10px}#s51m header b{flex:1;font-size:16px}
.s51p{position:relative;background:#fff;border-radius:8px;overflow:hidden}.s51p img{display:block;width:100%;height:auto}
.s51l{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;background:radial-gradient(circle,#ff3b57f2 0,#ff3b578c 35%,#ff3b5700 70%);mix-blend-mode:multiply;pointer-events:none}.s51l.sw{width:11%}
.s51m6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--mut);text-align:center}
.s51b{height:56px;background:#ffffff14;border-radius:5px;position:relative;overflow:hidden;margin-bottom:3px}.s51b i{position:absolute;left:0;right:0;bottom:0;height:0;background:#ff3b57}
#s51s{margin-top:10px;padding:8px 10px;border-radius:6px;background:#ffffff0f;font-size:13px;color:var(--mut);border-left:3px solid #ffb347}#s51s.ok{border-left-color:var(--ok);color:var(--tx)}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="glow"></div><div class="st"><div class="lg"><span style="--i:0">R</span><span style="--i:1">E</span><span style="--i:2">E</span><span style="--i:3">L</span></div><div class="ln"></div><div class="tg">O TEU DISCO · O TEU CINEMA</div></div></div>
<script>try{if(sessionStorage.getItem('reelIntro')||matchMedia('(prefers-reduced-motion:reduce)').matches)document.getElementById('intro').remove()}catch(e){}</script>
<header id="nv"></header>
<main id="main"></main>

<div class="modal" id="m1"><div>
  <h3 style="margin:0 0 14px;font-size:22px">Nova biblioteca</h3>
  <label>Nome<input id="ln" placeholder="Filmes, Séries, Anime…"></label>
  <label>Tipo<select id="lt"><option value="movies">Filmes (cada ficheiro é um título)</option><option value="series">Séries (cada subpasta é uma série)</option></select></label>
  <label>Link ou ID da pasta do Drive<input id="fid" placeholder="https://drive.google.com/drive/folders/…"></label>
  <div id="browse"><div style="color:var(--mut);margin-bottom:6px">Ou escolhe a pasta (modo OAuth):</div><div id="crumb" style="margin-bottom:6px"></div>
  <div id="folders" style="border:1px solid #ffffff1f;border-radius:8px;max-height:220px;overflow:auto;margin-bottom:16px"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="gh" onclick="$('#m1').classList.remove('on')">Cancelar</button><button class="pri" id="mk">Usar esta pasta</button></div>
</div></div>

<div id="pl">
  <div id="pb"><button class="ib" onclick="closePlayer()" aria-label="Voltar">←</button><b id="pt"></b><button class="btn s" id="s51btn" style="padding:8px 18px;font-size:15px" onclick="s51Open()">Som 5.1</button><button class="btn s" id="tk" style="display:none;padding:8px 18px;font-size:15px" onclick="trkMenu()">Áudio e legendas</button><button class="btn s" id="nx" style="display:none;padding:8px 18px;font-size:15px" onclick="nextEp()">Próximo ▶</button></div><div id="tm"></div><div id="s51m" role="dialog" aria-label="Colunas 5.1"></div>
  <div id="ld"></div><video id="vid" controls style="display:none"></video>
</div>
<div id="msg"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
const isId=s=>/^[A-Za-z0-9_-]+$/.test(String(s||''));
const safeUrl=u=>{const s=String(u||'').trim();return/^https?:\/\//i.test(s)?s:''};
const hasBFF=()=>!!document.querySelector('meta[name="reel-bff"]');
let BFF={bff:false,authenticated:false,configured:false,hasFfmpeg:false,clientId:'',hasRefreshToken:false};

let S={};try{S=JSON.parse(localStorage.getItem('reel')||'{}')}catch(e){}
S.cid??='';S.key??='';S.tmdb??='';S.art??={};if(S.artv!==7){S.art={};S.artv=7}delete S.emb;S.libs??=[];S.cache??={};S.subs??={};S.prog??={};S.lp??={};
let dbDone=false;
const save=()=>{
  try{
    const slim={cid:S.cid,key:S.key,tmdb:S.tmdb,artv:S.artv,libs:S.libs,prog:S.prog,lp:S.lp};
    if(!dbDone){slim.cache=S.cache;slim.art=S.art}
    localStorage.setItem('reel',JSON.stringify(slim));
  }catch(e){console.warn('localStorage save:',e)}
};
const DB=(()=>{
  let p=null;
  const open=()=>{
    if(p)return p;
    if(typeof indexedDB==='undefined')return p=Promise.resolve(null);
    p=new Promise(res=>{
      const t=setTimeout(()=>res(null),1500);
      try{
        const rq=indexedDB.open('reel-db',1);
        rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};
        rq.onsuccess=()=>{clearTimeout(t);res(rq.result)};
        rq.onerror=()=>{clearTimeout(t);res(null)};
      }catch(e){clearTimeout(t);res(null)}
    });
    return p;
  };
  const get=async k=>{const db=await open();if(!db)return undefined;return new Promise(res=>{try{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(undefined)}catch(e){res(undefined)}})};
  const set=async(k,v)=>{const db=await open();if(!db)return false;return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})};
  return{open,get,set};
})();
async function initStorage(){
  const db=await DB.open();
  if(!db)return;
  const[c,sb,a]=await Promise.all([DB.get('cache'),DB.get('subs'),DB.get('art')]);
  const hadLegacyCache=Object.keys(S.cache||{}).length>0;
  const hadLegacyArt=Object.keys(S.art||{}).length>0;
  if(c&&typeof c==='object')S.cache=c;
  else if(hadLegacyCache)await DB.set('cache',S.cache);
  if(sb&&typeof sb==='object')S.subs=sb;
  if(a&&typeof a==='object')S.art=a;
  else if(hadLegacyArt)await DB.set('art',S.art);
  dbDone=true;
  if(hadLegacyCache||hadLegacyArt)save();
}

const saveArt=()=>{if(dbDone)DB.set('art',S.art);else save()};

let tok=null,exp=0,authPromise=null,refreshTimer=0;
function sleepAbortable(ms,signal){
  return new Promise((res,rej)=>{
    if(signal&&signal.aborted)return rej(new DOMException('Aborted','AbortError'));
    const onAb=()=>{clearTimeout(t);rej(new DOMException('Aborted','AbortError'))};
    const t=setTimeout(()=>{if(signal)signal.removeEventListener('abort',onAb);res()},ms);
    if(signal)signal.addEventListener('abort',onAb,{once:true});
  });
}
async function fetchWithRetry(url,init={},retries=4){
  for(let attempt=0;;attempt++){
    const r=await fetch(url,init);
    if(r.ok||r.status===401||r.status===404||r.status===416)return r;
    let bodyTxt=null,retryable=r.status===429||r.status>=500;
    if(r.status===403){
      try{
        bodyTxt=await r.text();
        const reason=JSON.parse(bodyTxt)?.error?.errors?.[0]?.reason||'';
        retryable=reason==='rateLimitExceeded'||reason==='userRateLimitExceeded';
      }catch(e){}
      if(!retryable)return new Response(bodyTxt||'',{status:r.status,headers:r.headers});
    }else if(retryable&&attempt<retries){
      try{await r.body?.cancel()}catch(e){}
    }
    if(!retryable||attempt>=retries)return r;
    const ra=Number(r.headers.get('Retry-After'));
    const base=Number.isFinite(ra)&&ra>0?ra*1000:500*2**attempt;
    await sleepAbortable(Math.min(base+Math.random()*400,15000),init.signal);
  }
}
async function syncSWToken(){
  if(!canSW()||!tok)return;
  try{await(await caches.open('reel-tok')).put('/__tok',new Response(JSON.stringify({tok,exp})))}catch(e){}
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  if(!tok||!exp)return;
  const delay=Math.max(15000,exp-Date.now()-60000);
  refreshTimer=setTimeout(()=>{
    if(cur||document.visibilityState==='visible'){
      auth({silent:true,force:true}).catch(()=>{});
    }
  },delay);
}
async function refreshBFFStatus(){
  if(!hasBFF())return BFF;
  try{
    const r=await fetch('/api/auth/status',{cache:'no-store'});
    if(r.ok){BFF=await r.json();if(BFF.clientId&&!S.cid){S.cid=BFF.clientId;save()}}
  }catch(e){}
  return BFF;
}
function auth(opts={}){
  const{silent=false,force=false}=opts;
  if(hasBFF()&&BFF.configured){
    if(BFF.authenticated&&!force)return Promise.resolve('__bff__');
    if(silent){
      return refreshBFFStatus().then(st=>{
        if(st.authenticated)return'__bff__';
        throw new Error('Sessão expirada. Inicia sessão novamente nas Definições.');
      });
    }
    if(authPromise)return authPromise;
    if(!window.google?.accounts?.oauth2)return Promise.reject(new Error('Script da Google não carregou'));
    authPromise=new Promise((res,rej)=>{
      google.accounts.oauth2.initCodeClient({
        client_id:BFF.clientId||S.cid,
        scope:'https://www.googleapis.com/auth/drive.readonly',
        ux_mode:'popup',
        callback:async resp=>{
          if(resp.error)return rej(new Error(resp.error));
          try{
            const xr=await fetch('/api/auth/exchange',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({code:resp.code,redirectUri:'postmessage'})
            });
            const xd=await xr.json().catch(()=>({}));
            if(!xr.ok)return rej(new Error(xd.error||'Erro ao autenticar no servidor'));
            await refreshBFFStatus();
            res('__bff__');
          }catch(e){rej(e)}
        },
        error_callback:err=>rej(new Error(err?.message||err?.type||'Login Google cancelado ou bloqueado'))
      }).requestCode();
    }).finally(()=>{authPromise=null});
    return authPromise;
  }
  if(!force&&tok&&Date.now()<exp)return Promise.resolve(tok);
  if(authPromise)return authPromise;
  if(!window.google?.accounts?.oauth2){
    if(force&&Date.now()>=exp){tok=null;exp=0}
    return Promise.reject(new Error('Script da Google não carregou'));
  }
  authPromise=new Promise((res,rej)=>{
    const client=google.accounts.oauth2.initTokenClient({
      client_id:S.cid,
      scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:async r=>{
        if(r.error)return rej(new Error(r.error));
        tok=r.access_token;
        exp=Date.now()+(Math.max(60,Number(r.expires_in)||3600)-120)*1000;
        await syncSWToken();
        scheduleRefresh();
        res(tok);
      },
      error_callback:err=>rej(new Error(err?.message||err?.type||'Popup OAuth bloqueado ou fechado'))
    });
    client.requestAccessToken(silent?{prompt:''}:{});
  }).finally(()=>{authPromise=null});
  return authPromise;
}

const canSW=()=>'serviceWorker' in navigator&&location.protocol!=='file:';
let swErr=null;
const swRegPromise=canSW()?navigator.serviceWorker.register('./sw.js').catch(e=>{swErr=e;return null}):Promise.resolve(null);
if(canSW()){
  navigator.serviceWorker.addEventListener('message',async ev=>{
    if(ev.data?.type!=='REEL_NEED_TOKEN'||!ev.ports?.[0])return;
    try{
      const fresh=await auth({silent:true,force:!!ev.data.force});
      ev.ports[0].postMessage({tok:fresh,exp});
    }catch(e){
      ev.ports[0].postMessage({error:e.message||'Sessão Google expirada'});
    }
  });
}

async function prepSW(){
  if(hasBFF()&&BFF.authenticated)return;
  await auth();
  await syncSWToken();
  const reg=await Promise.race([swRegPromise,new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(!reg)throw new Error('Service Worker indisponível'+(swErr?': '+swErr.message:' (verifica se sw.js existe)'));
  const w=reg.installing||reg.waiting;
  if(w&&w.state!=='activated'){
    await Promise.race([
      new Promise(r=>w.addEventListener('statechange',()=>{if(w.state==='activated')r()})),
      new Promise(r=>setTimeout(r,4000))
    ]);
  }
  if(!navigator.serviceWorker.controller){
    try{reg.active?.postMessage({type:'CLAIM'})}catch(e){}
    await Promise.race([
      new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true})),
      new Promise(r=>setTimeout(r,2500))
    ]);
  }
  if(!navigator.serviceWorker.controller){
    throw new Error('Service Worker instalado mas ainda não controla esta aba. Recarrega a página (Cmd+R / F5) e tenta novamente.');
  }
}

function driveError(status,reason,usingKey){
  const M={
    downloadQuotaExceeded:usingKey?'Quota de downloads públicos excedida (API key). Configura o login OAuth nas Definições (⚙).':'O Google bloqueou este ficheiro por quota de downloads (acontece em ficheiros partilhados por terceiros). Faz uma cópia para o teu Drive.',
    rateLimitExceeded:'Demasiados pedidos seguidos à Google Drive API. Aguarda uns instantes.',
    userRateLimitExceeded:'Demasiados pedidos seguidos à Google Drive API. Aguarda uns instantes.',
    dailyLimitExceeded:'A quota diária da API key esgotou.',
    keyInvalid:'A API key é inválida.',
    insufficientFilePermissions:'Sem permissão no ficheiro ou pasta do Drive.',
    forbidden:usingKey?'Sem acesso: partilha a pasta como "Qualquer pessoa com o link" e confirma a API key.':'Sem permissão para aceder a este ficheiro no Drive.',
    notFound:'Ficheiro ou pasta não encontrada (pode ter sido apagada ou movida).'
  };
  const msg=(M[reason]||(status===404?M.notFound:(status===403?M.forbidden:'Erro Drive '+status)))+` [${status}${reason?' '+reason:''}]`;
  const err=new Error(msg);err.status=status;err.reason=reason;return err;
}

async function api(p,opts={}){
  let r;
  if(hasBFF()&&BFF.authenticated){
    r=await fetchWithRetry('/api/drive/'+p,{signal:opts.signal});
  }else{
    const u='https://www.googleapis.com/drive/v3/'+p;
    if(S.key){
      r=await fetchWithRetry(u+(p.includes('?')?'&':'?')+'key='+encodeURIComponent(S.key),{signal:opts.signal});
    }else{
      let t=await auth();
      r=await fetchWithRetry(u,{headers:{Authorization:'Bearer '+t},signal:opts.signal});
      if(r.status===401){
        try{await r.body?.cancel()}catch(e){}
        t=await auth({silent:true,force:true});
        r=await fetchWithRetry(u,{headers:{Authorization:'Bearer '+t},signal:opts.signal});
      }
    }
  }
  if(!r.ok){
    let j={};try{j=await r.json()}catch(e){}
    const reason=j?.error?.errors?.[0]?.reason||(r.status===404?'notFound':(r.status===403?'forbidden':''));
    throw driveError(r.status,reason,!!S.key);
  }
  return r;
}

async function ls(id,fo){
  if(id!=='root'&&!isId(id))throw new Error('ID de pasta inválido');
  let out=[],pt='';
  const q=`'${id}' in parents and trashed=false`+(fo?" and (mimeType='application/vnd.google-apps.folder' or mimeType='application/vnd.google-apps.shortcut')":'');
  do{
    const r=await(await api(`files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name,mimeType,size,thumbnailLink,shortcutDetails(targetId,targetMimeType))&pageSize=1000&orderBy=name&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`)).json();
    const files=r.files||[];
    out.push(...(fo?files.filter(f=>f.mimeType==='application/vnd.google-apps.folder'||f.shortcutDetails?.targetMimeType==='application/vnd.google-apps.folder'):files));
    pt=r.nextPageToken||'';
  }while(pt);
  return out;
}

const SEASON_DIR_RE=/^(?:season|temporada|temp|series|staffel|s)\s*0*\d+$|^(?:specials?|extras?|ova|featurettes?)$/i;
function pickShowName(path,libName){
  for(let i=path.length-1;i>=0;i--){
    if(!SEASON_DIR_RE.test(path[i].trim()))return path[i];
  }
  return path[0]||libName||'Outros';
}
const isVideoFile=f=>f.mimeType?.startsWith('video/')||/\.(mkv|mp4|avi|mov|webm|m4v|ts|m2ts|flv|wmv|mpg|mpeg)$/i.test(f.name||'');
const isSubFile=f=>/\.(srt|vtt|ass|ssa)$/i.test(f.name||'');

function reconcileProgress(libId,newFiles){
  const allIds=new Set(Object.entries(S.cache).filter(([k])=>k!==libId).flatMap(([,v])=>v.map(x=>x.id)));
  newFiles.forEach(x=>allIds.add(x.id));
  const byMeta=new Map();
  for(const f of newFiles){
    const ep=se(f.name),k=artKey(f)+'|'+ep[0]+'|'+ep[1];
    if(!byMeta.has(k))byMeta.set(k,f);
  }
  for(const[oid,p]of Object.entries(S.prog)){
    if(allIds.has(oid)||!p?.key)continue;
    const ep=p.ep||[0,0];
    const nf=byMeta.get(p.key+'|'+ep[0]+'|'+ep[1]);
    if(nf&&!S.prog[nf.id]){S.prog[nf.id]=p;delete S.prog[oid]}
  }
}

async function scan(lib){
  const out=[],subs=[],visited=new Set(),shortcutJobs=[];
  let warnCount=0;
  async function w(id,path,isRoot){
    if(visited.has(id))return;
    visited.add(id);
    let items;
    try{items=await ls(id)}catch(e){if(isRoot)throw e;warnCount++;console.warn('Subpasta ignorada:',id,e.message);return}
    for(const f of items){
      if(f.mimeType==='application/vnd.google-apps.folder'){
        await w(f.id,[...path,f.name],false);
      }else if(f.mimeType==='application/vnd.google-apps.shortcut'&&f.shortcutDetails?.targetId){
        const tid=f.shortcutDetails.targetId,tm=f.shortcutDetails.targetMimeType||'';
        if(tm==='application/vnd.google-apps.folder'){
          await w(tid,[...path,f.name],false);
        }else if(tm.startsWith('video/')||/\.(mkv|mp4|avi|mov|webm|m4v|ts|m2ts|flv|wmv|mpg|mpeg|srt|vtt|ass|ssa)$/i.test(f.name)){
          shortcutJobs.push({tid,origName:f.name,path,pid:id});
        }
      }else if(isVideoFile(f)){
        out.push({id:f.id,name:f.name,size:+f.size||0,mime:f.mimeType,show:lib.type==='series'?pickShowName(path,lib.name):(path[0]||''),lib:lib.id,th:f.thumbnailLink||'',pid:id});
      }else if(isSubFile(f)){
        subs.push({id:f.id,name:f.name,size:+f.size||0,mime:f.mimeType,show:lib.type==='series'?pickShowName(path,lib.name):(path[0]||''),pid:id,dir:path[path.length-1]||''});
      }
    }
  }
  await w(lib.folder,[],true);
  for(let i=0;i<shortcutJobs.length;i+=4){
    await Promise.all(shortcutJobs.slice(i,i+4).map(async j=>{
      try{
        const tf=await(await api(`files/${j.tid}?fields=id,name,mimeType,size,thumbnailLink&supportsAllDrives=true`)).json();
        const name=tf.name||j.origName;
        const rec={id:tf.id,name,size:+tf.size||0,mime:tf.mimeType,show:lib.type==='series'?pickShowName(j.path,lib.name):(j.path[0]||''),lib:lib.id,th:tf.thumbnailLink||'',pid:j.pid};
        if(isVideoFile({...tf,name}))out.push(rec);
        else if(isSubFile({...tf,name}))subs.push(rec);
      }catch(e){warnCount++}
    }));
  }
  reconcileProgress(lib.id,out);
  S.cache[lib.id]=out;
  S.subs[lib.id]=subs;
  saveCache();
  if(warnCount)toast(`Aviso: ${warnCount} item(ns) sem permissão foram ignorados`);
}

const se=n=>{
  const s=String(n||'').replace(/\.[^.]+$/,'');
  const m=s.match(/\bs(\d{1,2})[\s._-]*e(\d{1,3})\b/i)
    ||s.match(/\b(\d{1,2})x(\d{2,3})(?!\d)/i)
    ||s.match(/season\s*(\d{1,2})\D{1,12}episode\s*(\d{1,3})/i)
    ||s.match(/(?:^|[\s._-])(?:ep(?:isode)?|epis[oó]dio)[\s._-]*(\d{1,3})(?=[\s._-]|$)/i)
    ||s.match(/\s+-\s+(\d{1,3})(?=\s|$|[\[(])/);
  if(!m)return[0,0];
  return m.length>=3&&m[2]!==undefined?[+m[1],+m[2]]:[1,+m[1]];
};
const title=n=>{const o=n.replace(/\.[^.]+$/,'').replace(/[._]+/g,' ').trim();if(se(n)[1])return o;const c=clean(n);return c.t.length>1?c.t+(c.y?' ('+c.y+')':''):o};

/* ---- capas (TMDB + fallback automático) ---- */
const cj=t=>{const o=t;let w=0;t=t.replace(/^www\s+\S+\s+(com|net|org|to|cc|pt|tv|info|me|io)\b[\s\-–—:]*/i,'');
  if(/^(watch|download|stream)\s+(free|online|full|now|hd)\b/i.test(t)){t=t.replace(/^(watch|download|stream)\s+((free|online|full|now|hd)\s+)*/i,'');w=1}
  if(w||/\sfull\s+(movie|film)$/i.test(t))t=t.replace(/\s+(full\s+)?(movie|film)(\s+(online|free|hd|streaming|stream))*$/i,'');
  t=t.trim();return t.length>1?t:o};
const clean=n=>{
  const base=n.replace(/\.[^.]+$/,'').replace(/[._]+/g,' '),maxY=new Date().getFullYear()+2;
  const brYear=[...base.matchAll(/[\[(]\s*((?:19|20)\d{2})\s*[\])]/g)].pop();
  const rawHead=brYear?base.slice(0,brYear.index):base;
  const s=rawHead.replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  const techRe=/(^|[\s-])(\d{3,4}p|Full ?HD|FHD|UHD|4K|HDR10?\+?|DV|DoVi|MULTi|VF[FI2]?|VOSTFR|TRUEFRENCH|FRENCH|DUAL|DUBLADO|LEGENDADO|PT-?(PT|BR)|WEB-?Rip|WEB-?DL|WEB|Blu-?Ray|BDRip|HDRip|DVDRip|HDTV|REMUX|EXTENDED|REPACK|PROPER|[x×]26[45]|H ?26[45]|HEVC|AV1|AAC|AC3|EAC3|DTS|TrueHD|Atmos|S\d{1,2}E\d{1,3})(?=[\s-]|$)/i;
  const ti=s.slice(3).search(techRe);
  const techCut=ti<0?s.length:ti+3;
  const yrs=brYear?[]:[...s.slice(0,techCut).matchAll(/(?:^|\s)((?:19|20)\d{2})(?=\s|-|$)/g)].filter(m=>m.index+m[0].length-4>=3&&+m[1]<=maxY);
  const lastYr=yrs.length?yrs[yrs.length-1]:null;
  const yrCut=lastYr?lastYr.index:s.length;
  const cut=Math.min(techCut,yrCut);
  const y=(brYear&&brYear[1])||(lastYr&&lastYr[1])||((s.slice(techCut).match(/^\W*((?:19|20)\d{2})(?=\W|$)/)||[])[1])||'';
  return{t:cj(s.slice(0,cut).replace(/[\s\-–—:]+$/,'').trim()),y};
};
const artKey=f=>{const l=S.libs.find(x=>x.id===f.lib),sr=l&&l.type==='series'&&f.show,c=clean(sr?f.show+'.x':f.name);return(sr?'t':'m')+'|'+c.t+'|'+c.y};
const th=(f,w=640,raw)=>{const a=!raw&&f&&S.art[artKey(f)];if(!a||a.n)return thOld(f,w);

  const u=a.b||a.p;return u?`<img loading="lazy" src="https://image.tmdb.org/t/p/${w>900?'w1280':'w780'}${esc(u)}" onerror="this.remove()">`:thOld(f,w)};
const jp=u=>new Promise((res,rej)=>{const n='_cb'+Math.random().toString(36).slice(2),sc=document.createElement('script');
  const t=setTimeout(()=>{delete window[n];sc.remove();rej(new Error('iTunes não respondeu'))},12000);

  sc.src=u+'&callback='+n;document.head.appendChild(sc)});
async function itu(k){const[t,q,y]=k.split('|'),nz=x=>x.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  if(nz(q).length<2){S.art[k]={n:Date.now()};return}
  const r=await jp('https://itunes.apple.com/search?limit=15&media='+(t==='m'?'movie&entity=movie':'tvShow&entity=tvSeason')+'&term='+encodeURIComponent(q)),nm=x=>nz(x.trackName||x.collectionName||'');
  const m=(r.results||[]).filter(x=>x.artworkUrl100&&nm(x).includes(nz(q)));
  const sc=x=>((y&&(x.releaseDate||'').startsWith(y))?0:1000)+nm(x).length;m.sort((a,b)=>sc(a)-sc(b));
  S.art[k]=m[0]?{u:m[0].artworkUrl100.replace(/\/\d+x\d+bb/,'/600x600bb')}:{n:Date.now()}}
const nz=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const wtk=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
const wcov=(q,t)=>{const a=wtk(q),b=new Set(wtk(t));return a.length?a.filter(w=>b.has(w)).length/a.length:0};
async function jf(u,ms=7000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function imdb(q,y,t){const slug=nz(q);if(!slug)return'';const fc=slug[0]||'x';
  const d=await jf('https://v3.sg.media-imdb.com/suggestion/'+fc+'/'+encodeURIComponent(q.toLowerCase())+'.json',6000),ok=t==='t'?/^(tvSeries|tvMiniSeries|TV series|TV mini-series)$/i:/^(movie|feature|tvMovie|TV movie|video)$/i,want=wtk(q).join(' ');
  const m=(d.d||[]).map((x,i)=>({x,i})).filter(({x})=>x.i&&x.i.imageUrl&&/^tt/.test(x.id||'')&&ok.test(x.qid||x.q||'')&&wcov(q,x.l)>=.75&&wcov(x.l,q)>=.5);
  const sc=({x,i})=>(wtk(x.l).join(' ')===want?0:100)+(y&&t==='m'?(+x.y===+y?0:Math.abs((+x.y||0)-y)<=1?10:60):0)+i;
  m.sort((a,b)=>sc(a)-sc(b));
  return m[0]?m[0].x.i.imageUrl.replace(/\._V1_.*\.(jpg|png)$/i,'._V1_UY600_.$1'):''}
async function tvm(q){const r=await jf('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)),n=nz(q);
  const m=r.filter(x=>x.show&&x.show.image&&nz(x.show.name).includes(n));
  m.sort((a,b)=>(nz(a.show.name)===n?0:1)-(nz(b.show.name)===n?0:1)||b.score-a.score);
  return m[0]?(m[0].show.image.original||m[0].show.image.medium).replace(/^http:/,'https:'):''}
async function wk(q,y,t){let err=0,done=0;const qs=new Set(wtk(q));
  for(const lg of['en','pt']){
    const hint=lg==='pt'?(t==='m'?'filme':'série'):(t==='m'?'film':'television series'),api='https://'+lg+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&';
    for(const term of(y&&t==='m'?[q+' '+y+' '+hint,q+' '+hint]:[q+' '+hint])){
      try{const d=await jf(api+'generator=search&gsrnamespace=0&gsrlimit=6&prop=revisions&rvprop=content&rvslots=main&rvsection=0&gsrsearch='+encodeURIComponent(term));done=1;
        const c=Object.values((d.query&&d.query.pages)||{}).map(p=>{const r=p.revisions&&p.revisions[0],w=(r&&r.slots&&r.slots.main&&r.slots.main['*'])||'';return{p,w}})
          .filter(({p,w})=>wcov(q,p.title)>=.99&&/\{\{\s*(infobox|info\/)\s*(film|television|tv|filme|televis)/i.test(w))
          .map(({p,w})=>{const m=w.match(/\|\s*(?:image|imagem)\s*=\s*([^\n|]+)/i),f=m?m[1].replace(/<!--.*?-->/g,'').replace(/^\s*\[\[\s*/,'').replace(/^(file|image|ficheiro|imagem|arquivo)\s*:/i,'').replace(/\]\].*$/,'').trim():'';
            const yr=y&&(p.title.includes(y)||new RegExp('releas\\w*\\s*=[^\\n]*\\b'+y+'\\b','i').test(w))?0:(y?10:0),ex=wtk(p.title).filter(x=>!qs.has(x)&&!/^(film|filme|tv|series|television|\d{4})$/.test(x)).length;
            return{f,k:yr+ex*5+(p.index||0)}}).filter(x=>x.f).sort((a,b)=>a.k-b.k);
        for(const x of c.slice(0,3)){const d2=await jf(api+'prop=imageinfo&iiprop=url&iiurlwidth=480&titles='+encodeURIComponent('File:'+x.f));
          const pg=Object.values((d2.query&&d2.query.pages)||{})[0],ii=pg&&pg.imageinfo&&pg.imageinfo[0],u=ii&&(ii.thumburl||ii.url);if(u&&!/\.svg/i.test(u))return u}
      }catch(e){err=1}}}
  if(err&&!done)throw new Error('wikipedia');return''}
async function auto(k){const[t,q,y]=k.split('|');let u='',ok=0;
  const ps=t==='t'?[()=>imdb(q,y,t),()=>tvm(q),()=>wk(q,y,t)]:[()=>imdb(q,y,t),()=>wk(q,y,t)];
  for(const p of ps){try{u=await p();ok=1;if(u)break}catch(e){}}
  return u||(ok?'':null)}
async function tm(path,q){const k=S.tmdb,h={};let u='https://api.themoviedb.org/3/'+path+'?'+q;
  if(k.length>40)h.Authorization='Bearer '+k;else u+='&api_key='+encodeURIComponent(k);
  const r=await fetchWithRetry(u,{headers:h});if(!r.ok)throw new Error('TMDB '+r.status);return(await r.json()).results||[]}
async function cov(k){const[t,q,y]=k.split('|'),Q='query='+encodeURIComponent(q);
  let r=await tm(t==='m'?'search/movie':'search/tv',Q+(y?(t==='m'?'&year=':'&first_air_date_year=')+y:''));
  if(!r.length&&y)r=await tm(t==='m'?'search/movie':'search/tv',Q);
  if(!r.length)r=(await tm('search/multi',Q)).filter(x=>x.poster_path||x.backdrop_path);
  const x=r.find(x=>x.backdrop_path||x.poster_path);S.art[k]=x?{b:x.backdrop_path||'',p:x.poster_path||''}:{n:Date.now()}}
let cvB=false,cvDirty=false,coverMsg='';
const isNegExpired=a=>a&&a.n&&(a.n===1||(Date.now()-a.n>86400000));
const cstat=()=>{const ks=[...new Set(allFiles().map(artKey))];return'capas '+ks.filter(k=>S.art[k]&&!S.art[k].n).length+'/'+ks.length};
const idle=()=>!cur&&!$('#cid');
async function covers(force){
  if(cvB){cvDirty=true;return}
  if(force)for(const k in S.art)if(S.art[k].n||(S.tmdb&&S.art[k].u))delete S.art[k];
  const ks=[...new Set(allFiles().map(artKey))].filter(k=>!S.art[k]||isNegExpired(S.art[k]));
  coverMsg=cstat();if(!ks.length)return;cvB=true;cvDirty=false;
  try{
    if(S.tmdb){for(let i=0;i<ks.length;i+=10){await Promise.all(ks.slice(i,i+10).map(cov));saveArt();coverMsg=cstat();if(idle())render2()}}
    else{const q=ks.slice(),it=[],sl=ms=>new Promise(r=>setTimeout(r,ms));let fin=0,rt=0;
      const rr=()=>{if(rt)return;rt=setTimeout(()=>{rt=0;saveArt();coverMsg=cstat();if(idle())render2()},350)};
      const pump=async()=>{while(q.length){const k=q.shift();let u=null;try{u=await auto(k)}catch(e){}if(u){S.art[k]={u};rr()}else if(u==='')it.push(k)}};
      let last=0;const itw=async()=>{while(!fin||it.length){if(it.length){const w=last+3000-Date.now();if(w>0)await sl(w);const k=it.shift();try{await itu(k);rr()}catch(e){}last=Date.now()}else await sl(250)}};
      await Promise.all([Promise.all(Array.from({length:8},pump)).then(()=>{fin=1}),itw()]);
      clearTimeout(rt);rt=0;saveArt()}
  }catch(e){coverMsg='erro nas capas: '+(e.message==='TMDB 401'?'chave TMDB inválida':e.message);toast(coverMsg)}
  cvB=false;if(!coverMsg.startsWith('erro'))coverMsg=cstat();if(idle())render2();
  if(cvDirty){cvDirty=false;covers(false)}
}

let stack=[];

}

async function rescan(id){const lib=S.libs.find(l=>l.id===id);if(!lib)return;toast('A analisar o Drive…');
  try{await scan(lib);toast((S.cache[id]||[]).length+' vídeos encontrados')}catch(e){toast(e.message)}V={lib:id,show:null,home:false,season:null};render();covers()}
function delLib(id){if(!confirm('Remover esta biblioteca? Os ficheiros no Drive não são tocados.'))return;S.libs=S.libs.filter(l=>l.id!==id);delete S.cache[id];delete S.subs[id];saveCache();go()}
function go(l=null,s=null){V={lib:l,show:s,home:!l,season:null};render()}
function mark(id){const p=S.prog[id]=P(id);p.w=!p.w;if(!p.w)p.t=0;p.at=Date.now();save();render2()}
function forgetProg(id){delete S.prog[id];save();if(cur&&cur.id===id)closePlayer();else render2()}

function dispatchAction(el){
  const act=el.dataset.act;if(!act)return;
  const id=el.dataset.id||'';
  if(act==='go')go(el.dataset.lib||null,el.dataset.show||null);
  else if(act==='newLib')newLib();
  else if(act==='settings')settings();
  else if(act==='play')play(id);
  else if(act==='mark')mark(id);
  else if(act==='dl')dl(id);
  else if(act==='rescan')rescan(id);
  else if(act==='delLib')delLib(id);
  else if(act==='season'){V.season=Number(el.dataset.s)||0;render2()}
  else if(act==='sl')sl(el,Number(el.dataset.dir)||1);
  else if(act==='driveEmbed')driveEmbed(id);
  else if(act==='openExt')openExt(el.dataset.app,id);
  else if(act==='copyLink')copyLink(id);
  else if(act==='dlM3u')dlM3u(id);
  else if(act==='transcode')playTranscode(id);
  else if(act==='forgetProg')forgetProg(id);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.closest('.act,.ab'))e.stopPropagation();
  dispatchAction(el);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.c[data-act]')){
    e.preventDefault();dispatchAction(e.target);
  }
});

function s51Build(){const m=$('#s51m');if(m.dataset.b)return;m.dataset.b=1;

/* Modo "ficheiro": o remux já tem os blocos de áudio; descodifico uma cópia à parte (OfflineAudioContext singleton, sem saída)
   e meço o nível de cada canal. O som do filme continua a sair só pelo player, sem qualquer alteração. */
function s51Feed(ini,fa,t){S51.q.push({ini,fa,t,done:false});const cap=S51.dec?40:4;while(S51.q.length>cap)S51.q.shift();if(S51.dec)s51Pump()}
/* Espreita (sem alterar) o que o remux envia ao SourceBuffer de áudio. O código do remux não é tocado. */
(()=>{try{const MS=window.MediaSource||window.ManagedMediaSource,SB=window.SourceBuffer;if(!MS||!SB)return;
  const mt=new WeakMap(),add=MS.prototype.addSourceBuffer,ap=SB.prototype.appendBuffer;
  MS.prototype.addSourceBuffer=function(t){const sb=add.apply(this,arguments);try{mt.set(sb,t)}catch(_){}return sb};
  SB.prototype.appendBuffer=function(d){try{if(/^audio\/mp4/.test(mt.get(this)||'')){
      const u=d instanceof Uint8Array?d:new Uint8Array(d.buffer||d),k=String.fromCharCode(u[4],u[5],u[6],u[7]);
      if(k==='ftyp')S51.ini=u.slice();
      else if(k==='moof'&&S51.ini){let i=-1;for(let x=8;x<Math.min(u.length-16,400);x++)if(u[x]===0x74&&u[x+1]===0x66&&u[x+2]===0x64&&u[x+3]===0x74){i=x;break}
        if(i>0){const dv=new DataView(u.buffer,u.byteOffset),b=u[i+4]===1?dv.getUint32(i+8)*4294967296+dv.getUint32(i+12):dv.getUint32(i+8);s51Feed(S51.ini,u.slice(),b/1000)}}}}catch(_){}
    return ap.apply(this,arguments)}}catch(_){}})();
async function s51Pump(){if(S51.busy)return;S51.busy=true;
  try{for(let e;e=S51.q.find(x=>!x.done);){e.done=true;await s51Dec(e)}}finally{S51.busy=false}}
async function s51Dec(e){const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!O)return;
  try{const f=new Uint8Array(e.ini.length+e.fa.length);f.set(e.ini,0);f.set(e.fa,e.ini.length);
    if(!S51.offCtx)S51.offCtx=new O(6,1,48000);
    const ab=await new Promise((res,rej)=>{const p=S51.offCtx.decodeAudioData(f.buffer.slice(0),res,rej);p&&p.then&&p.then(res,rej)});
    const n=ab.numberOfChannels,w=Math.round(ab.sampleRate*.05),N=Math.floor(ab.length/w);S51.nch=n;
    const lv=[];for(let c=0;c<6;c++){const L=new Float32Array(N);
      if(c<n){const d=ab.getChannelData(c);for(let k=0;k<N;k++){let s=0;for(let j=k*w;j<k*w+w;j++)s+=d[j]*d[j];L[k]=Math.max(0,Math.min(1,(20*Math.log10(Math.sqrt(s/w)+1e-9)+55)/55))}}

    if(S51.tl.length>150){const lim=$('#vid').currentTime-120;S51.tl=S51.tl.filter(x=>x.t+x.N*x.w>lim)}}
  catch(x){S51.err=(x&&x.message)||String(x)||'erro desconhecido'}}
function s51At(t){for(let i=S51.tl.length-1;i>=0;i--){const e=S51.tl[i];if(t>=e.t&&t<e.t+e.N*e.w)return e.lv.map(a=>a[Math.floor((t-e.t)/e.w)])}return null}

function s51Ctx(){/* só para o modo captura: nunca é ligado à saída de áudio */
  if(S51.ctx){if(S51.ctx.state==='suspended')S51.ctx.resume();return S51.ctx}
  const c=S51.ctx=new(window.AudioContext||window.webkitAudioContext)();c.resume&&c.resume();return c}

  try{S51.srcNode&&S51.srcNode.disconnect()}catch(_){}

function s51Ligar(){const v=$('#vid');

    s51Disc();
    const c=s51Ctx(),src=c.createMediaStreamSource(ms),sp=c.createChannelSplitter(6);
    src.connect(sp);/* nada é ligado ao destination */
    S51.srcNode=src;S51.splitNode=sp;
    S51.nch=(tr[0].getSettings&&tr[0].getSettings().channelCount)||0;
    S51.an=[0,1,2,3,4,5].map(i=>{const a=c.createAnalyser();a.fftSize=1024;sp.connect(a,i);return{a,b:new Float32Array(1024)}});
    S51.mode='cap';S51.on=true;return true}
  catch(e){s51Msg('Não foi possível ligar a análise: '+e.message);return false}}
function s51Open(){$('#tm').classList.remove('on');const m=$('#s51m');
  if(!m.classList.toggle('on')){s51Stop();return}
  s51Build();S51.msg='';
  if(s51Ligar())s51Msg($('#vid').paused?'Carrega em play para ver as colunas.':'A analisar o áudio…');
  s51Stop();S51.last=performance.now();s51Loop()}
function s51Close(){$('#s51m').classList.remove('on');s51Stop()}
function s51Stop(){cancelAnimationFrame(S51.raf);S51.raf=0}
function s51Reset(){
  s51Close();S51.testSeq++;
  if(S51.testCtx){try{S51.testCtx.close()}catch(_){}S51.testCtx=null}
  s51Disc();
  S51.on=false;S51.mode='';S51.dec=false;
  S51.act.fill(0);S51.lv.fill(0);S51.pl=0;S51.q=[];S51.tl=[];S51.err='';S51.nch=0;S51.ini=null;S51.tn=null;S51.msg='';
}
function s51Diag(){const n=S51C.map(c=>c[0]).filter((_,i)=>S51.act[i]),k=S51.nch?' · áudio analisado: '+S51.nch+' canais':'';
  if(S51.mode==='file'&&!S51.tl.length){s51Msg(S51.err?'Não consegui descodificar o áudio à parte ('+S51.err+'). O som do filme não é afetado.':'A descodificar o áudio…');return}
  if(S51.act[2]||S51.act[3]||S51.act[4]||S51.act[5])s51Msg('Sinal multicanal detetado: '+n.join(', ')+k+'.',1);
  else s51Msg('Até agora só há sinal em FL e FR'+k+'.'+(S51.nch>2?' Pode ser uma cena só com diálogo à frente.':S51.mode==='cap'?' Pode ser uma faixa estéreo, ou a captura só entregar 2 canais.':' A faixa é estéreo.'))}
function s51Loop(){const now=performance.now(),dt=now-S51.last,v=$('#vid');S51.last=now;
  if(!$('#pl').classList.contains('on')){s51Close();return}
  const tn=S51.tn&&now<S51.tn.u?S51.tn.i:-1,play=!v.paused&&!v.ended;
  if(play&&!S51.on&&now-S51.rt>1000){S51.rt=now;if(s51Ligar())s51Msg('A analisar o áudio…')}
  if(play&&S51.on)S51.pl+=dt;
  const fl=S51.mode==='file'&&play?s51At(v.currentTime):null;
  for(let i=0;i<6;i++){let t=0;
    if(tn>=0)t=tn===i?1:0;
    else if(fl){t=fl[i]||0;if(t>.08)S51.act[i]=1}
    else if(S51.mode==='cap'&&play){const{a,b}=S51.an[i];a.getFloatTimeDomainData(b);let s=0;for(let k=0;k<b.length;k++)s+=b[k]*b[k];
      t=Math.max(0,Math.min(1,(20*Math.log10(Math.sqrt(s/b.length)+1e-9)+55)/55));if(t>.08)S51.act[i]=1}
    S51.lv[i]+=(t-S51.lv[i])*(t>S51.lv[i]?.6:.12);const x=S51.lv[i];
    S51.L[i].style.opacity=Math.min(1,x*1.1);S51.L[i].style.transform=`translate(-50%,-50%) scale(${.5+x*.9})`;S51.B[i].style.height=x*100+'%'}
  if(S51.on&&S51.pl>4000)s51Diag();
  S51.raf=requestAnimationFrame(s51Loop)}
async function s51Test(){$('#vid').pause();const seq=++S51.testSeq;
  if(S51.testCtx){try{S51.testCtx.close()}catch(_){}S51.testCtx=null}
  const c=S51.testCtx=new(window.AudioContext||window.webkitAudioContext)(),d=c.destination,mx=d.maxChannelCount||2;
  try{
    try{d.channelCount=Math.min(6,mx);d.channelCountMode='explicit';d.channelInterpretation='speakers'}catch(_){}
    s51Msg('Teste pela Web Audio: este browser aceita '+mx+' canais.'+(mx<6?' Com menos de 6 as colunas ouvem-se misturadas, mas isto só afeta este teste: o filme continua a sair pelo player normal.':''),mx>=6);
    for(const i of[0,2,1,5,4,3]){
      if(seq!==S51.testSeq)return;
      S51.tn={i,u:performance.now()+1300};
      const b=c.createBuffer(1,c.sampleRate*1.2,c.sampleRate),dt=b.getChannelData(0);for(let k=0;k<dt.length;k++)dt[k]=(Math.random()*2-1)*.3;
      const s=c.createBufferSource();s.buffer=b;let n=s;if(i===3){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=120;s.connect(f);n=f}
      const g=c.createGain(),t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.05);g.gain.setValueAtTime(1,t+1.1);g.gain.linearRampToValueAtTime(0,t+1.2);
      const m=c.createChannelMerger(6);n.connect(g);g.connect(m,0,i);m.connect(d);s.start();
      await new Promise(r=>setTimeout(r,1400));
    }
  }finally{S51.tn=null;try{c.close()}catch(_){}if(S51.testCtx===c)S51.testCtx=null}}
$('#vid').addEventListener('loadstart',()=>{s51Disc();S51.on=false;S51.mode='';S51.dec=false;S51.act.fill(0);S51.lv.fill(0);S51.pl=0;S51.q=[];S51.tl=[];S51.err='';S51.nch=0});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#s51m').classList.contains('on')){e.stopImmediatePropagation();s51Close()}},true);
</script>
